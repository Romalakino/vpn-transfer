[environment]
TERM=xterm-256color

shell=$SHELL
font=monospace:size=12
dpi-aware=no
pad=5x5 center

initial-window-size-chars=100x30
initial-window-mode=windowed

[colors-dark]
background=000000
foreground=FFFFFF
regular0=1A1A1A
regular1=808080
regular2=808080
regular3=808080
regular4=808080
regular5=808080
regular6=808080
regular7=FFFFFF
bright0=4C4C4C
bright1=BFBFBF
bright2=BFBFBF
bright3=BFBFBF
bright4=BFBFBF
bright5=BFBFBF
bright6=BFBFBF
bright7=FFFFFF

alpha=0.75

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy = Control+Shift+c
clipboard-paste = Control+Shift+v
search-start = Control+Shift+r

[scrollback]
lines=10000
multiplier=3.0
